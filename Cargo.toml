[package]
name = "renert"
version = "0.1.0"
edition = "2021"
description = "Rust extractor of named entities from Russian texts"
license = "MIT"
repository = "https://github.com/media-tel/renert"
readme = "README.md"
keywords = ["rust", "nlp", "morphology", "russian", "earley-parser"]

[dependencies]
regex = "1.10"
lazy_static = "1.4"
serde = { version = "1.0.144", features = ["derive"] }
# preserve_order: JSON object key order matches FactRecord::as_json (OrderedFactMap).
serde_json = { version = "1.0.85", features = ["preserve_order"] }
morph-rs = "0.2.0"
once_cell = "1.21.3"
lru = "0.16.3"
parking_lot = "0.12"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "address_parity"
path = "benches/rust/address_parity.rs"

[[bench]]
name = "tokenize_addresses"
path = "benches/rust/tokenize_addresses.rs"
harness = false

[[bench]]
name = "parse_addresses"
path = "benches/rust/parse_addresses.rs"
harness = false

[[bench]]
name = "init_bench"
path = "benches/rust/init_bench.rs"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
debug = false
